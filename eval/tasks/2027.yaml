- id: units-wheel-speed-2027
  season: "2027"
  tags: [units]
  files: [src/main/java/frc/robot/util/WheelMath.java]
  prompt: |
    WPILib 2027 (alpha 7), Java. Write src/main/java/frc/robot/util/WheelMath.java with a static method that takes a
    wheel's angular velocity as a WPILib units AngularVelocity measure and the wheel diameter as a Distance measure
    and returns the wheel's linear velocity as a LinearVelocity measure, plus a second static method that returns the
    same value as a plain double in meters per second. Use the WPILib units library throughout.

- id: trajectory-sample-2027
  season: "2027"
  tags: [trajectory]
  files: [src/main/java/frc/robot/util/Paths.java]
  prompt: |
    WPILib 2027 (alpha 7), Java. Write src/main/java/frc/robot/util/Paths.java with a static method that generates a
    smooth spline trajectory from (0, 0, 0°) through the interior point (1.5, 0.5) to (3, 1, 0°) with a max velocity of
    3 m/s and max acceleration of 2 m/s², and a static method `Pose2d poseAt(double seconds)` that samples that
    trajectory. Use WPILib's own trajectory generator.

- id: arm-pid-command-2027
  season: "2027"
  tags: [commands, control]
  files: [src/main/java/frc/robot/commands/ArmToAngle.java]
  prompt: |
    WPILib 2027 (alpha 7), Java, Commands v2. Write src/main/java/frc/robot/commands/ArmToAngle.java: a command that
    drives an arm to a target angle with a WPILib PID controller (kP 5, kI 0, kD 0.2, tolerance 0.02 rad) and ends
    when it reaches the setpoint. Its constructor takes a `DoubleSupplier angleRad` (measurement), a
    `DoubleConsumer setVoltage` (output), the target angle in radians and the arm Subsystem it requires.

- id: swerve-pose-estimator-2027
  season: "2027"
  tags: [kinematics, estimation]
  files: [src/main/java/frc/robot/Localizer.java]
  prompt: |
    WPILib 2027 (alpha 7), Java. Write src/main/java/frc/robot/Localizer.java: it keeps the robot's field pose for a
    four-module swerve drive (modules at (±0.3, ±0.3) m) using WPILib's swerve pose estimator. Add
    `void update(Rotation2d gyroAngle, SwerveModulePosition[] modules)`, `void addVision(Pose2d pose, double
    timestampSeconds)` and `Pose2d getPose()`.

