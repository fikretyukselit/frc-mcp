# Agent-level eval tasks, 2027 season (WPILib 2027.0.0-alpha-7). Prompts are
# what a student would ask in a 2027 project: they name the season and the
# library versions (as the project's build files do) but never the API names
# under test. Each task has a compiling reference solution in
# reference/<id>/ (checked by `agenteval references`).
- id: swerve-module-targets-2027
  season: "2027"
  tags: [kinematics, swerve]
  files: [src/main/java/frc/robot/SwerveMath.java]
  prompt: |
    This is a WPILib 2027 (alpha 7) Java robot project. Write src/main/java/frc/robot/SwerveMath.java: a class
    SwerveMath whose constructor takes the drivetrain's track width and wheelbase in meters (modules at the four
    corners, front-left first). Add a method that takes a field-relative desired velocity (vx and vy in m/s, omega in
    rad/s) and the robot's current heading in radians, and returns the four module targets for WPILib's swerve
    kinematics, desaturated to 4.5 m/s. Use WPILib's own kinematics classes.

- id: robot-skeleton-2027
  season: "2027"
  tags: [framework, commands]
  files: [src/main/java/frc/robot/Main.java, src/main/java/frc/robot/Robot.java, src/main/java/frc/robot/RobotContainer.java]
  prompt: |
    Set up a new WPILib 2027 (alpha 7) command-based Java robot project: write Main.java, Robot.java and
    RobotContainer.java in src/main/java/frc/robot. Robot runs the command scheduler every loop, schedules the
    autonomous command from RobotContainer when autonomous starts and cancels it when teleop starts.
    RobotContainer.getAutonomousCommand() can return a command that does nothing for now. Use Commands v2.

- id: auto-chooser-2027
  season: "2027"
  tags: [dashboard, commands]
  files: [src/main/java/frc/robot/AutoSelector.java]
  prompt: |
    WPILib 2027 (alpha 7), Java, Commands v2. Write src/main/java/frc/robot/AutoSelector.java: a class that offers
    three autonomous routines on the dashboard for the drive team to pick from before the match ("Do nothing" as the
    default, "Taxi" which prints "taxi", "Two piece" which prints "two piece"), and has a method
    `Command getSelected()` that returns the chosen routine. Publish the chooser under the name "Auto".

- id: telemetry-publish-2027
  season: "2027"
  tags: [dashboard, telemetry]
  files: [src/main/java/frc/robot/subsystems/Status.java]
  prompt: |
    WPILib 2027 (alpha 7), Java, Commands v2. Write src/main/java/frc/robot/subsystems/Status.java: a subsystem that
    every loop publishes to the dashboard the battery voltage, the remaining match time, whether the robot is enabled,
    and a robot Pose2d that other code sets with `setPose(Pose2d pose)`.

- id: tunable-elevator-pid-2027
  season: "2027"
  tags: [dashboard, tunables, control]
  files: [src/main/java/frc/robot/subsystems/Elevator.java]
  prompt: |
    WPILib 2027 (alpha 7), Java, Commands v2. Write src/main/java/frc/robot/subsystems/Elevator.java: an elevator
    subsystem with one PWM Spark MAX motor controller on PWM channel 0 and a quadrature encoder on DIO 0 and 1
    (0.01 m per pulse). It holds a height setpoint with a WPILib PID controller whose kP, kI and kD can be tuned from
    the dashboard while the robot runs (defaults 4, 0, 0.1). Add `void setHeight(double meters)` and
    `boolean atSetpoint()`.

- id: xbox-bindings-2027
  season: "2027"
  tags: [commands, controllers]
  files: [src/main/java/frc/robot/Bindings.java]
  prompt: |
    WPILib 2027 (alpha 7), Java, Commands v2, driver uses an Xbox controller on port 0 plugged into the Driver
    Station. Write src/main/java/frc/robot/Bindings.java with a static method
    `void configure(Command intake, Command shoot, Command stow)`: intake runs while the A button is held, stow runs
    once when B is pressed, and shoot runs while the right trigger is pressed past halfway. Use command-based
    trigger bindings.

- id: flywheel-talonfx-2027
  season: "2027"
  vendordeps: ["CTRE-Phoenix (v6)"]
  tags: [phoenix6, control]
  files: [src/main/java/frc/robot/subsystems/Flywheel.java]
  prompt: |
    WPILib 2027 (alpha 7), Java, Commands v2, CTRE Phoenix 6 26.70.0-alpha-2. Write
    src/main/java/frc/robot/subsystems/Flywheel.java: a shooter flywheel subsystem driven by one Kraken X60 (TalonFX)
    with CAN id 5 on the CANivore bus named "canivore". Configure velocity gains (kS 0.1, kV 0.12, kP 0.2) and
    coast mode once in the constructor, and add `void setRPM(double rpm)` using closed-loop velocity control,
    `double getRPM()` and `boolean atSpeed(double toleranceRpm)`.

- id: arm-sparkmax-2027
  season: "2027"
  vendordeps: [REVLib]
  tags: [revlib, control]
  files: [src/main/java/frc/robot/subsystems/Arm.java]
  prompt: |
    WPILib 2027 (alpha 7), Java, Commands v2, REVLib 2027.0.0-alpha-7. Write src/main/java/frc/robot/subsystems/Arm.java:
    an arm subsystem with a SPARK MAX (CAN id 9 on the robot controller's first built-in CAN port, brushless NEO).
