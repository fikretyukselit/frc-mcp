version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # Close on read-only resources (rows, shards, response bodies, files
      # opened for reading) has no actionable failure mode.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (*archive/zip.ReadCloser).Close
        - (*github.com/fikretyukselit/frc-mcp/internal/index.Reader).Close
        - (*github.com/fikretyukselit/frc-mcp/internal/vec.Layer).Close
        - (*github.com/modelcontextprotocol/go-sdk/mcp.ClientSession).Close
        - (*github.com/modelcontextprotocol/go-sdk/mcp.ServerSession).Close
        - (net/http.ResponseWriter).Write
        - io.WriteString
    gosec:
      excludes:
        - G104 # see errcheck exclusions above
        - G115 # int conversions are bounds-checked by construction in vec/index
        - G301 # shards and vector layers are public data; 0755 dirs are intended
        - G306 # same for 0644 files
        - G304 # file paths come from operator flags or the shard dir, never from tool input
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, unparam, prealloc]
formatters:
  enable:
    - gofmt
    - goimports
