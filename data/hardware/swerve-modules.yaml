  - part: revmaxswerve
    name: REV MAXSwerve (3 in)
    category: swerve_module
    source: rev
    citation: https://www.revrobotics.com/rev-21-3005/
    checked: 2026-09-29
    fields:
      steer_ratio: 46.423645320197046
      wheel_diameter_in: 3
      weight_with_neo_lb: 3.80
      weight_with_falcon500_lb: 3.97
    note: >-
      Azimuth ratio exactly 9424:203 (about 46.42:1), driven by a NEO 550 through an UltraPlanetary. Low, mid and
      high speed drive pinions (12T, 13T, 14T) are included; the resulting drive ratios are not given as text. The
      included Through Bore Encoder gives 10-bit angle resolution on the turning axis.
