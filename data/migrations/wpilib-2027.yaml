    to:
      java: org.wpilib.simulation.DriverStationSim#setJoystickAxesMaximumIndex
    notes: >-
      setJoystickAxesMaximumIndex(stick, n) keeps the old meaning (the first n axes available). #8302 replaced counts with availability bitmasks because future DS versions may leave holes: the low-level setJoystickAxesAvailable(stick, mask) takes a bitmask, so an old count n is (1 << n) - 1 there, not n. Indices also start at 0 instead of 1.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8302

