  # --- Hardware ---
  - id: motorcontroller-set-to-setthrottle
    kind: rename
    from:
      java: edu.wpi.first.wpilibj.motorcontrol.MotorController#set
      cpp: frc::MotorController#Set
    to:
      java: org.wpilib.hardware.motor.MotorController#setThrottle
      cpp: wpi::MotorController#SetThrottle
    notes: '`set(double speed)` became setDutyCycle in #8479 and was then renamed to `setThrottle(double throttle)` in #8720. `get()` is now `getThrottle()`.'
    citation: https://github.com/wpilibsuite/allwpilib/pull/8720

  - id: motorcontroller-stopmotor-removed
    kind: removed
    from:
      java: edu.wpi.first.wpilibj.motorcontrol.MotorController#stopMotor
      cpp: frc::MotorController#StopMotor
    notes: MotorController::StopMotor() was removed. Use disable() (org.wpilib.hardware.motor.MotorController#disable), which the PR says does the same thing in practice.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8483

  - id: relay-removed
    kind: removed
    from:
      java: edu.wpi.first.wpilibj.Relay
      cpp: frc::Relay
      python: wpilib.Relay
    notes: Relay classes were removed; the 2027 changelog lists relay among hardware not supported on Systemcore. The PR names no direct WPILib replacement.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7695

  - id: servo-removed
    kind: removed
    from:
      java: edu.wpi.first.wpilibj.Servo
      cpp: frc::Servo
      python: wpilib.Servo
    notes: Systemcore cannot power servos directly. The PR names REV Servo Hubs as a working replacement.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8270

  - id: adxrs450-removed
    kind: removed
    from:
      java: edu.wpi.first.wpilibj.ADXRS450_Gyro
      cpp: frc::ADXRS450_Gyro
      python: wpilib.ADXRS450_Gyro
    notes: SPI support was removed, so SPI IMUs (ADIS16448, ADIS16470, ADXL345, ADXRS450) are unsupported on Systemcore (2027 removed-features page). The 2027 changelog lists the Systemcore onboard IMU (org.wpilib.hardware.imu.OnboardIMU) among the new hardware support.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7678

  - id: adis16470-removed
    kind: removed
    from:
      java: edu.wpi.first.wpilibj.ADIS16470_IMU
      cpp: frc::ADIS16470_IMU
    notes: Removed with SPI support; Systemcore does not support SPI. The 2027 changelog lists the Systemcore onboard IMU (org.wpilib.hardware.imu.OnboardIMU) among the new hardware support.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7678

  - id: ultrasonic-removed
    kind: removed
    from:
      java: edu.wpi.first.wpilibj.Ultrasonic
      cpp: frc::Ultrasonic
    notes: Removed because Systemcore does not support that type of counter (#7723; 2027 removed-features page). No WPILib replacement is named.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7723

  # --- Units / AprilTag ---
  - id: mutablemeasure-removed
    kind: removed
    from:
      java: edu.wpi.first.units.MutableMeasure
    notes: Mutable Java unit implementations were removed. Use immutable Measure values (e.g. `Meters.of(x)`); the 2027 removed-features page says Systemcore has enough RAM for immutable units.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8115

  - id: apriltagfields-to-fields
    kind: rename
    from:
      java: edu.wpi.first.apriltag.AprilTagFields
    to:
      java: org.wpilib.fields.Fields
    notes: AprilTag layout data was merged into the field JSON and Field class. The 2027 changelog says "AprilTagFields is now part of an integrated Fields class"; load a field with `Field.loadField(Fields)` and use `Field#getTagPose(int)`.
    citation: https://github.com/wpilibsuite/allwpilib/pull/9166

  - id: apriltagfieldlayout-to-vendordep
    kind: removed
    from:
      java: edu.wpi.first.apriltag.AprilTagFieldLayout
      cpp: frc::AprilTagFieldLayout
    notes: The apriltag library was converted to a vendordep and is no longer part of core WPILib. Add the AprilTag vendordep to keep using AprilTagFieldLayout; for built-in field tag poses use org.wpilib.fields.Field#getTagPose (#9166).
    citation: https://github.com/wpilibsuite/allwpilib/pull/9203
