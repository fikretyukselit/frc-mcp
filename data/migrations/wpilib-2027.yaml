# Curated migration rules. Every rule cites the upstream change.
library: wpilib
from_season: "2026"
to_season: "2027"
rules:
  # --- Kinematics: Speeds -> Velocities (#8479) ---
  - id: chassisspeeds-to-chassisvelocities
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.ChassisSpeeds
      cpp: frc::ChassisSpeeds
      python: wpimath.kinematics.ChassisSpeeds
    to:
      java: org.wpilib.math.kinematics.ChassisVelocities
      cpp: wpi::math::ChassisVelocities
      python: wpimath.ChassisVelocities
    notes: ChassisSpeeds was renamed to ChassisVelocities as part of replacing "speed" with "velocity" in wpimath. The fields are vx, vy and omega.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: swervemodulestate-to-swervemodulevelocity
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.SwerveModuleState
      cpp: frc::SwerveModuleState
      python: wpimath.kinematics.SwerveModuleState
    to:
      java: org.wpilib.math.kinematics.SwerveModuleVelocity
      cpp: wpi::math::SwerveModuleVelocity
      python: wpimath.SwerveModuleVelocity
    notes: SwerveModuleState was renamed to SwerveModuleVelocity (#8479 renamed SwerveModuleState.java to SwerveModuleVelocity.java). Its speed field is now named velocity.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: differentialdrivewheelspeeds-to-velocities
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.DifferentialDriveWheelSpeeds
      cpp: frc::DifferentialDriveWheelSpeeds
      python: wpimath.kinematics.DifferentialDriveWheelSpeeds
    to:
      java: org.wpilib.math.kinematics.DifferentialDriveWheelVelocities
      cpp: wpi::math::DifferentialDriveWheelVelocities
      python: wpimath.DifferentialDriveWheelVelocities
    notes: DifferentialDriveWheelSpeeds was renamed to DifferentialDriveWheelVelocities.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: mecanumdrivewheelspeeds-to-velocities
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.MecanumDriveWheelSpeeds
      cpp: frc::MecanumDriveWheelSpeeds
      python: wpimath.kinematics.MecanumDriveWheelSpeeds
    to:
      java: org.wpilib.math.kinematics.MecanumDriveWheelVelocities
      cpp: wpi::math::MecanumDriveWheelVelocities
      python: wpimath.MecanumDriveWheelVelocities
    notes: MecanumDriveWheelSpeeds was renamed to MecanumDriveWheelVelocities.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: swervekinematics-toswervemodulestates
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.SwerveDriveKinematics#toSwerveModuleStates
      cpp: frc::SwerveDriveKinematics#ToSwerveModuleStates
    to:
      java: org.wpilib.math.kinematics.SwerveDriveKinematics#toSwerveModuleVelocities
      cpp: wpi::math::SwerveDriveKinematics#ToSwerveModuleVelocities
    notes: Takes a ChassisVelocities and returns SwerveModuleVelocity[] (C++ wpi::util::array of SwerveModuleVelocity).
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: swervekinematics-towheelspeeds
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.SwerveDriveKinematics#toWheelSpeeds
      cpp: frc::SwerveDriveKinematics#ToWheelSpeeds
    to:
      java: org.wpilib.math.kinematics.SwerveDriveKinematics#toWheelVelocities
      cpp: wpi::math::SwerveDriveKinematics#ToWheelVelocities
    notes: Inverse kinematics method renamed; 2027 signature is SwerveModuleVelocity[] toWheelVelocities(ChassisVelocities chassisVelocities).
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: swervekinematics-tochassisspeeds
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.SwerveDriveKinematics#toChassisSpeeds
      cpp: frc::SwerveDriveKinematics#ToChassisSpeeds
    to:
      java: org.wpilib.math.kinematics.SwerveDriveKinematics#toChassisVelocities
      cpp: wpi::math::SwerveDriveKinematics#ToChassisVelocities
    notes: Forward kinematics method renamed; 2027 signature is ChassisVelocities toChassisVelocities(SwerveModuleVelocity... moduleVelocities).
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: swervekinematics-desaturatewheelspeeds
    kind: signature
    from:
      java: edu.wpi.first.math.kinematics.SwerveDriveKinematics#desaturateWheelSpeeds
      cpp: frc::SwerveDriveKinematics#DesaturateWheelSpeeds
    to:
      java: org.wpilib.math.kinematics.SwerveDriveKinematics#desaturateWheelVelocities
      cpp: wpi::math::SwerveDriveKinematics#DesaturateWheelVelocities
    notes: >-
      Renamed to desaturateWheelVelocities (#8479) and made immutable in #8274 - it no longer modifies the array in place; it returns a new one, e.g. `public static SwerveModuleVelocity[] desaturateWheelVelocities(SwerveModuleVelocity[] moduleVelocities, double attainableMaxVelocity)`. Use the return value.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8274

  - id: diffkinematics-towheelspeeds
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.DifferentialDriveKinematics#toWheelSpeeds
      cpp: frc::DifferentialDriveKinematics#ToWheelSpeeds
    to:
      java: org.wpilib.math.kinematics.DifferentialDriveKinematics#toWheelVelocities
      cpp: wpi::math::DifferentialDriveKinematics#ToWheelVelocities
    notes: 2027 signature is DifferentialDriveWheelVelocities toWheelVelocities(ChassisVelocities chassisVelocities).
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: diffkinematics-tochassisspeeds
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.DifferentialDriveKinematics#toChassisSpeeds
      cpp: frc::DifferentialDriveKinematics#ToChassisSpeeds
    to:
      java: org.wpilib.math.kinematics.DifferentialDriveKinematics#toChassisVelocities
      cpp: wpi::math::DifferentialDriveKinematics#ToChassisVelocities
    notes: 2027 signature is ChassisVelocities toChassisVelocities(DifferentialDriveWheelVelocities wheelVelocities).
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: mecanumkinematics-towheelspeeds
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.MecanumDriveKinematics#toWheelSpeeds
    to:
      java: org.wpilib.math.kinematics.MecanumDriveKinematics#toWheelVelocities
    notes: 2027 signature is MecanumDriveWheelVelocities toWheelVelocities(ChassisVelocities chassisVelocities), with an overload taking a Translation2d centerOfRotation.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: chassisspeeds-fromfieldrelativespeeds
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.ChassisSpeeds#fromFieldRelativeSpeeds
      cpp: frc::ChassisSpeeds#FromFieldRelativeSpeeds
    to:
      java: org.wpilib.math.kinematics.ChassisVelocities#toRobotRelative
      cpp: wpi::math::ChassisVelocities#ToRobotRelative
    notes: >-
      The static factory was replaced by an instance method in #7545; `ChassisSpeeds.fromFieldRelativeSpeeds(speeds, angle)` becomes `velocities.toRobotRelative(angle)` (2027 signature `public ChassisVelocities toRobotRelative(Rotation2d robotAngle)`). The type rename is from #8479.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7545

  - id: chassisspeeds-fromrobotrelativespeeds
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.ChassisSpeeds#fromRobotRelativeSpeeds
      cpp: frc::ChassisSpeeds#FromRobotRelativeSpeeds
    to:
      java: org.wpilib.math.kinematics.ChassisVelocities#toFieldRelative
      cpp: wpi::math::ChassisVelocities#ToFieldRelative
    notes: >-
      The static factory was replaced by an instance method in #7545; `ChassisSpeeds.fromRobotRelativeSpeeds(speeds, angle)` becomes `velocities.toFieldRelative(angle)`.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7545

  - id: chassisspeeds-discretize
    kind: signature
    from:
      java: edu.wpi.first.math.kinematics.ChassisSpeeds#discretize
      cpp: frc::ChassisSpeeds#Discretize
    to:
      java: org.wpilib.math.kinematics.ChassisVelocities#discretize
      cpp: wpi::math::ChassisVelocities#Discretize
    notes: discretize is now an instance method (#7545). 2027 Java signature is `public ChassisVelocities discretize(double dt)`; C++ is `constexpr ChassisVelocities Discretize(wpi::units::second_t dt) const`. Replace `ChassisSpeeds.discretize(speeds, dt)` with `velocities.discretize(dt)`.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7545

  - id: chassisspeeds-vxmeterspersecond
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.ChassisSpeeds#vxMetersPerSecond
    to:
      java: org.wpilib.math.kinematics.ChassisVelocities#vx
    notes: Unit suffixes were removed from wpimath field names (#7529); the unit (m/s) is now in the API docs.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7529

  - id: chassisspeeds-vymeterspersecond
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.ChassisSpeeds#vyMetersPerSecond
    to:
      java: org.wpilib.math.kinematics.ChassisVelocities#vy
    notes: Unit suffixes were removed from wpimath field names (#7529); the unit (m/s) is now in the API docs.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7529

  - id: chassisspeeds-omegaradianspersecond
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.ChassisSpeeds#omegaRadiansPerSecond
    to:
      java: org.wpilib.math.kinematics.ChassisVelocities#omega
    notes: Unit suffixes were removed from wpimath field names (#7529); the unit (rad/s) is now in the API docs.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7529

  - id: swervemodulestate-speed-field
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.SwerveModuleState#speedMetersPerSecond
      cpp: frc::SwerveModuleState#speed
    to:
      java: org.wpilib.math.kinematics.SwerveModuleVelocity#velocity
      cpp: wpi::math::SwerveModuleVelocity#velocity
    notes: >-
      The module speed field is now `velocity` (m/s) on SwerveModuleVelocity. The Java unit suffix was dropped in #7529 and "speed" became "velocity" in #8479.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8479

  - id: swervemodulestate-optimize
    kind: signature
    from:
      java: edu.wpi.first.math.kinematics.SwerveModuleState#optimize
      cpp: frc::SwerveModuleState#Optimize
    to:
      java: org.wpilib.math.kinematics.SwerveModuleVelocity#optimize
      cpp: wpi::math::SwerveModuleVelocity#Optimize
    notes: optimize no longer mutates in place and the deprecated static overload is gone. 2027 signature is `public SwerveModuleVelocity optimize(Rotation2d currentAngle)` (C++ `constexpr SwerveModuleVelocity Optimize(const Rotation2d &currentAngle) const`). Use the return value, e.g. `var v = desired.optimize(angle).cosineScale(angle);`.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8274

  - id: swervemodulestate-cosinescale
    kind: signature
    from:
      java: edu.wpi.first.math.kinematics.SwerveModuleState#cosineScale
      cpp: frc::SwerveModuleState#CosineScale
    to:
      java: org.wpilib.math.kinematics.SwerveModuleVelocity#cosineScale
      cpp: wpi::math::SwerveModuleVelocity#CosineScale
    notes: cosineScale now returns a new value instead of mutating (2027 `public SwerveModuleVelocity cosineScale(Rotation2d currentAngle)`). Use the return value.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8274

  - id: differentialwheelspeeds-desaturate
    kind: signature
    from:
      java: edu.wpi.first.math.kinematics.DifferentialDriveWheelSpeeds#desaturate
      cpp: frc::DifferentialDriveWheelSpeeds#Desaturate
    to:
      java: org.wpilib.math.kinematics.DifferentialDriveWheelVelocities#desaturate
      cpp: wpi::math::DifferentialDriveWheelVelocities#Desaturate
    notes: desaturate now returns a new object instead of mutating (2027 `public DifferentialDriveWheelVelocities desaturate(double attainableMaxVelocity)`, annotated @NoDiscard). Use the return value.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8274

  - id: differentialwheelspeeds-leftmeterspersecond
    kind: rename
    from:
      java: edu.wpi.first.math.kinematics.DifferentialDriveWheelSpeeds#leftMetersPerSecond
    to:
      java: org.wpilib.math.kinematics.DifferentialDriveWheelVelocities#left
    notes: Unit suffixes were removed from wpimath field names (#7529). The same applies to rightMetersPerSecond -> right.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7529

  # --- Geometry ---
  - id: rotation2d-getradians-wrapped
    kind: behavior
    from:
      java: edu.wpi.first.math.geometry.Rotation2d#getRadians
    to:
      java: org.wpilib.math.geometry.Rotation2d#getRadians
    notes: >-
      Silent breaking change - getRadians(), getDegrees() and getRotations() now return a wrapped angle (the 2027 changelog points to #7490). Code that relied on accumulated (unwrapped) angles should store a double or an Angle instead of a Rotation2d.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7490

  - id: translation2d-getangle-optional
    kind: signature
    from:
      java: edu.wpi.first.math.geometry.Translation2d#getAngle
      cpp: frc::Translation2d#Angle
    to:
      java: org.wpilib.math.geometry.Translation2d#getAngle
      cpp: wpi::math::Translation2d#Angle
    notes: getAngle now returns `Optional<Rotation2d>` (C++ `std::optional<Rotation2d>`), so a zero-length translation no longer produces a Rotation2d that violates its invariants. Handle the empty case explicitly.
    citation: https://github.com/wpilibsuite/allwpilib/pull/9266

  - id: pose2d-exp-removed
    kind: removed
    from:
      java: edu.wpi.first.math.geometry.Pose2d#exp
      cpp: frc::Pose2d#Exp
    notes: >-
      Pose2d.exp(Twist2d) was removed. Use `pose.plus(twist.exp())`, where Twist2d#exp returns a Transform2d (recommendation from #8188 and the 2027 removed-features page).
    citation: https://github.com/wpilibsuite/allwpilib/pull/8188

  - id: pose2d-log-removed
    kind: removed
    from:
      java: edu.wpi.first.math.geometry.Pose2d#log
    notes: >-
      Pose2d.log(Pose2d) was removed alongside exp. #8188 replaces it with `Twist2d Transform2d.log()`, so compute the transform between the poses (e.g. `end.minus(start)`) and call log() on it.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8188

  # --- Controllers / trajectories ---
  - id: holonomicdrivecontroller-removed
    kind: removed
    from:
      java: edu.wpi.first.math.controller.HolonomicDriveController
      cpp: frc::HolonomicDriveController
      python: wpimath.controller.HolonomicDriveController
    notes: >-
      Removed in #8119, which describes it as "just 3 PID controllers". Use PIDController / ProfiledPIDController directly, or the path follower of Choreo or PathPlanner.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8119

  - id: ramsetecontroller-removed
    kind: removed
    from:
      java: edu.wpi.first.math.controller.RamseteController
      cpp: frc::RamseteController
      python: wpimath.controller.RamseteController
    notes: RamseteController and RamseteCommand were removed. Use LTVUnicycleController (org.wpilib.math.controller.LTVUnicycleController), as the deprecation message and the 2027 removed-features page recommend.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7522

  - id: trajectorygenerator-renamed
    kind: rename
    from:
      java: edu.wpi.first.math.trajectory.TrajectoryGenerator
      cpp: frc::TrajectoryGenerator
      python: wpimath.trajectory.TrajectoryGenerator
    to:
      java: org.wpilib.math.trajectory.DrivetrainSplineTrajectoryGenerator
      cpp: wpi::math::DrivetrainSplineTrajectoryGenerator
      python: wpimath.DrivetrainSplineTrajectoryGenerator
    notes: Renamed to DrivetrainSplineTrajectoryGenerator because it only applies to spline-based drivetrain trajectories. It now returns a DrivetrainSplineTrajectory.
    citation: https://github.com/wpilibsuite/allwpilib/pull/9086

  - id: trajectorygenerator-generatetrajectory
    kind: rename
    from:
      java: edu.wpi.first.math.trajectory.TrajectoryGenerator#generateTrajectory
      cpp: frc::TrajectoryGenerator#GenerateTrajectory
    to:
      java: org.wpilib.math.trajectory.DrivetrainSplineTrajectoryGenerator#generate
      cpp: wpi::math::DrivetrainSplineTrajectoryGenerator#Generate
    notes: '`TrajectoryGenerator.generateTrajectory(...)` becomes `DrivetrainSplineTrajectoryGenerator.generate(...)`, returning DrivetrainSplineTrajectory; the same waypoint/TrajectoryConfig overloads exist.'
    citation: https://github.com/wpilibsuite/allwpilib/pull/9086

  - id: trajectoryparameterizer-renamed
    kind: rename
    from:
      java: edu.wpi.first.math.trajectory.TrajectoryParameterizer
      cpp: frc::TrajectoryParameterizer
      python: wpimath.trajectory.TrajectoryParameterizer
    to:
      java: org.wpilib.math.trajectory.DrivetrainSplineTrajectoryParameterizer
      cpp: wpi::math::DrivetrainSplineTrajectoryParameterizer
      python: wpimath.DrivetrainSplineTrajectoryParameterizer
    notes: Renamed to DrivetrainSplineTrajectoryParameterizer alongside the generator.
    citation: https://github.com/wpilibsuite/allwpilib/pull/9086

  - id: trajectory-state-to-drivetrainsplinesample
    kind: rename
    from:
      java: edu.wpi.first.math.trajectory.Trajectory.State
    to:
      java: org.wpilib.math.trajectory.DrivetrainSplineSample
    notes: >-
      The Trajectory API rewrite (#8172) made Trajectory generic over a sample type, and SplineSample replaced Trajectory.State. #9078 later renamed SplineSample to DrivetrainSplineSample.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8172

  - id: linearsystemid-to-models
    kind: rename
    from:
      java: edu.wpi.first.math.system.plant.LinearSystemId
      cpp: frc::LinearSystemId
      python: wpimath.system.plant.LinearSystemId
    to:
      java: org.wpilib.math.system.Models
      cpp: wpi::math::Models
      python: wpimath.Models
    notes: LinearSystem factories were reorganized into Models with <mechanism>FromPhysicalConstants / <mechanism>FromSysId names. The member rules below list the mappings.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8468

  - id: linearsystemid-createflywheelsystem
    kind: rename
    from:
      java: edu.wpi.first.math.system.plant.LinearSystemId#createFlywheelSystem
      cpp: frc::LinearSystemId#FlywheelSystem
    to:
      java: org.wpilib.math.system.Models#flywheelFromPhysicalConstants
      cpp: wpi::math::Models#FlywheelFromPhysicalConstants
    notes: >-
      Same arguments (motor, J, gearing), as the examples in #8468 show.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8468

  - id: linearsystemid-createelevatorsystem
    kind: rename
    from:
      java: edu.wpi.first.math.system.plant.LinearSystemId#createElevatorSystem
      cpp: frc::LinearSystemId#ElevatorSystem
    to:
      java: org.wpilib.math.system.Models#elevatorFromPhysicalConstants
      cpp: wpi::math::Models#ElevatorFromPhysicalConstants
    notes: >-
      Same arguments (motor, mass, drum radius, gearing), as the examples in #8468 show.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8468

  - id: linearsystemid-createsinglejointedarmsystem
    kind: rename
    from:
      java: edu.wpi.first.math.system.plant.LinearSystemId#createSingleJointedArmSystem
      cpp: frc::LinearSystemId#SingleJointedArmSystem
    to:
      java: org.wpilib.math.system.Models#singleJointedArmFromPhysicalConstants
      cpp: wpi::math::Models#SingleJointedArmFromPhysicalConstants
    notes: >-
      Same arguments (motor, J, gearing), as the examples in #8468 show.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8468

  - id: linearsystemid-createdrivetrainvelocitysystem
    kind: rename
    from:
      java: edu.wpi.first.math.system.plant.LinearSystemId#createDrivetrainVelocitySystem
      cpp: frc::LinearSystemId#DrivetrainVelocitySystem
    to:
      java: org.wpilib.math.system.Models#differentialDriveFromPhysicalConstants
      cpp: wpi::math::Models#DifferentialDriveFromPhysicalConstants
    notes: >-
      Same arguments (motor, mass, wheel radius, trackwidth/2, J, gearing), as the examples in #8468 show.
    citation: https://github.com/wpilibsuite/allwpilib/pull/8468

  - id: linearsystemid-identifydrivetrainsystem
    kind: rename
    from:
      java: edu.wpi.first.math.system.plant.LinearSystemId#identifyDrivetrainSystem
      cpp: frc::LinearSystemId#IdentifyDrivetrainSystem
    to:
      java: org.wpilib.math.system.Models#differentialDriveFromSysId
      cpp: wpi::math::Models#DifferentialDriveFromSysId
    notes: Same SysId gain arguments (kV/kA linear, kV/kA angular, optional trackwidth).
    citation: https://github.com/wpilibsuite/allwpilib/pull/8468

  - id: linearsystemid-identifyvelocitysystem
    kind: rename
    from:
      java: edu.wpi.first.math.system.plant.LinearSystemId#identifyVelocitySystem
    to:
      java: org.wpilib.math.system.Models#flywheelFromSysId
    notes: '`identifyVelocitySystem(kV, kA)` becomes `flywheelFromSysId(kV, kA)` (StateSpaceFlywheelSysId example in #8468).'
    citation: https://github.com/wpilibsuite/allwpilib/pull/8468

  # --- Dashboard / telemetry (#7773) ---
  - id: sendablechooser-to-selectable
    kind: rename
    from:
      java: edu.wpi.first.wpilibj.smartdashboard.SendableChooser
      cpp: frc::SendableChooser
    to:
      java: org.wpilib.tunable.Selectable
      cpp: wpi::tunables::Selectable
    notes: SendableChooser was replaced by Selectable in the Tunables API. Publish it with `Tunables.publish("Auto choices", chooser)` instead of `SmartDashboard.putData`.
    citation: https://github.com/wpilibsuite/allwpilib/pull/7773

  - id: sendablechooser-setdefaultoption
    kind: rename
    from:
      java: edu.wpi.first.wpilibj.smartdashboard.SendableChooser#setDefaultOption
    to:
      java: org.wpilib.tunable.Selectable#addDefault
    notes: '`chooser.setDefaultOption(name, value)` becomes `chooser.addDefault(name, value)` (timed template in #7773).'
    citation: https://github.com/wpilibsuite/allwpilib/pull/7773

  - id: sendablechooser-addoption
    kind: rename
    from:
      java: edu.wpi.first.wpilibj.smartdashboard.SendableChooser#addOption
    to:
      java: org.wpilib.tunable.Selectable#add
    notes: '`chooser.addOption(name, value)` becomes `chooser.add(name, value)`. getSelected() keeps its name.'
    citation: https://github.com/wpilibsuite/allwpilib/pull/7773

  - id: smartdashboard-removed
    kind: removed
    from:
      java: edu.wpi.first.wpilibj.smartdashboard.SmartDashboard
      cpp: frc::SmartDashboard
      python: wpilib.SmartDashboard
    notes: >-
      SmartDashboard was removed. The migration guide in #7773 says to use `Telemetry.log(...)` (org.wpilib.telemetry.Telemetry) for values that were only displayed, and the Tunable API (`Tunables.addDouble(...)` etc.) for values read back with get*().
    citation: https://github.com/wpilibsuite/allwpilib/pull/7773

  - id: smartdashboard-putnumber
    kind: rename
    from:
      java: edu.wpi.first.wpilibj.smartdashboard.SmartDashboard#putNumber
    to:
      java: org.wpilib.telemetry.Telemetry#log
    notes: 'Migration guide: `SmartDashboard.putNumber("Drive/leftVelocity", x)` becomes `Telemetry.log("Drive/leftVelocity", x)`, or log through a `Telemetry.getTable("Drive")` table. Call it periodically.'
    citation: https://github.com/wpilibsuite/allwpilib/pull/7773

  - id: smartdashboard-putdata
    kind: rename
    from:
      java: edu.wpi.first.wpilibj.smartdashboard.SmartDashboard#putData
    to:
      java: org.wpilib.telemetry.Telemetry#log
