      #8424 replaced updateNotifierAlarm(handle, triggerTime) with setNotifierAlarm(handle, alarmTime, intervalTime, absolute), which supports periodic alarms at the HAL level; #8457 added a final boolean ack parameter. Handlers must now acknowledge each alarm with acknowledgeNotifierAlarm.
