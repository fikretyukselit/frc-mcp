    to:
      java: org.wpilib.math.util.MathUtil#inverseLerp
    notes: >-
      Renamed by #8232. Behavior change: inverseLerp(a, b, q) returns t such that q = a + (b - a)t without clamping, while inverseInterpolate() clamped the result to [0, 1]. It returns 0 if a = b.
