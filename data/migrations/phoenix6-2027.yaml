    kind: signature
    from:
      java: com.ctre.phoenix6.hardware.CANrange#CANrange
      python: phoenix6.hardware.CANrange#CANrange
    to:
      java: com.ctre.phoenix6.hardware.CANrange#CANrange
      python: phoenix6.hardware.CANrange#CANrange
    notes: 'String-bus and ID-only constructors were removed. 2027 signature: `public CANrange(int deviceId, CANBus canbus)`.'
    citation: https://api.ctr-electronics.com/changelog

  - id: candi-constructor-canbus
    kind: signature
    from:
      java: com.ctre.phoenix6.hardware.CANdi#CANdi
      python: phoenix6.hardware.CANdi#CANdi
    to:
      java: com.ctre.phoenix6.hardware.CANdi#CANdi
