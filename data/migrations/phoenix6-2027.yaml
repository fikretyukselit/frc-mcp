# Curated migration rules. Every rule cites the upstream change.
library: phoenix6
from_season: "2026"
to_season: "2027"
rules:
  - id: talonfx-constructor-canbus
    kind: signature
    from:
      java: com.ctre.phoenix6.hardware.TalonFX#TalonFX
      python: phoenix6.hardware.TalonFX#TalonFX
    to:
      java: com.ctre.phoenix6.hardware.TalonFX#TalonFX
      python: phoenix6.hardware.TalonFX#TalonFX
    notes: 'The CAN-bus-string constructor (deprecated in 2026) and the ID-only constructor were removed in 26.50.0-alpha-1. The only 2027 constructor is `public TalonFX(int deviceId, CANBus canbus)` (Python `__init__(self, device_id: int, canbus: CANBus)`). Create one CANBus object and pass it to every device.'
    citation: https://api.ctr-electronics.com/changelog

  - id: cancoder-constructor-canbus
    kind: signature
    from:
      java: com.ctre.phoenix6.hardware.CANcoder#CANcoder
