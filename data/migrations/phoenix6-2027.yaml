  - id: canbus-canport-constructor
    kind: signature
    from:
      java: com.ctre.phoenix6.CANBus#CANBus
    to:
      java: com.ctre.phoenix6.CANBus#CANBus
    notes: '26.70.0-alpha-2 replaced `CANBus.systemcore(int)` with `new CANBus(CANPort)` (2027 signature `public CANBus(org.wpilib.hardware.bus.CANPort canPort)`) and removed the CANBus constructors that took a hoot replay file; construct a HootReplay before any devices instead. On Systemcore, an empty-string CANBus defaults to "can_s1".'
    citation: https://api.ctr-electronics.com/changelog

  - id: talonfx-set-to-setthrottle
    kind: rename
    from:
      java: com.ctre.phoenix6.hardware.TalonFX#set
      python: phoenix6.hardware.TalonFX#set
    to:
      java: com.ctre.phoenix6.hardware.TalonFX#setThrottle
      python: phoenix6.hardware.TalonFX#set_throttle
    notes: TalonFX/TalonFXS `set` was renamed to `setThrottle` in 26.50.0-alpha-1, matching WPILib's MotorController rename.
    citation: https://api.ctr-electronics.com/changelog

  - id: talonfx-get-to-getthrottle
    kind: rename
    from:
      java: com.ctre.phoenix6.hardware.TalonFX#get
      python: phoenix6.hardware.TalonFX#get
    to:
      java: com.ctre.phoenix6.hardware.TalonFX#getThrottle
      python: phoenix6.hardware.TalonFX#get_throttle
    notes: TalonFX/TalonFXS `get` was renamed to `getThrottle` in 26.50.0-alpha-1.
    citation: https://api.ctr-electronics.com/changelog

  - id: talonfx-setneutralmode-to-configneutralmode
    kind: rename
    from:
      java: com.ctre.phoenix6.hardware.TalonFX#setNeutralMode
      python: phoenix6.hardware.TalonFX#setNeutralMode
    to:
      java: com.ctre.phoenix6.hardware.TalonFX#configNeutralMode
      python: phoenix6.hardware.TalonFX#config_neutral_mode
    notes: '`setNeutralMode` was renamed to `configNeutralMode` in 26.50.0-alpha-1 (same arguments: NeutralModeValue and optional timeoutSeconds).'
    citation: https://api.ctr-electronics.com/changelog

  - id: utils-getsystemtimeseconds
    kind: rename
    from:
      java: com.ctre.phoenix6.Utils#getSystemTimeSeconds
      python: phoenix6.utils#get_system_time_seconds
    to:
      java: com.ctre.phoenix6.Utils#getMonotonicTimeSeconds
      python: phoenix6.utils#get_monotonic_time_seconds
    notes: Renamed in 26.70.0-alpha-2.
    citation: https://api.ctr-electronics.com/changelog

  - id: utils-fpgatocurrenttime-removed
    kind: removed
    from:
      java: com.ctre.phoenix6.Utils#fpgaToCurrentTime
    notes: Utils.fpgaToCurrentTime() and currentTimeToFPGATime() were removed in 26.50.0-alpha-1. The changelog names no replacement; the related time source is Utils.getMonotonicTimeSeconds() (renamed from getSystemTimeSeconds in 26.70.0-alpha-2).
    citation: https://api.ctr-electronics.com/changelog

  - id: swerverequest-applyrobotspeeds
    kind: rename
    from:
      java: com.ctre.phoenix6.swerve.SwerveRequest.ApplyRobotSpeeds
    to:
      java: com.ctre.phoenix6.swerve.SwerveRequest.ApplyRobotVelocity
    notes: Renamed in 26.50.0-alpha-1. The `Speeds` field/`withSpeeds` became `Velocity`/`withVelocity(ChassisVelocities)`, and `DesaturateWheelSpeeds` became `DesaturateWheelVelocities`.
    citation: https://api.ctr-electronics.com/changelog

  - id: swerverequest-applyfieldspeeds
    kind: rename
    from:
      java: com.ctre.phoenix6.swerve.SwerveRequest.ApplyFieldSpeeds
    to:
      java: com.ctre.phoenix6.swerve.SwerveRequest.ApplyFieldVelocity
    notes: Renamed in 26.50.0-alpha-1. The `Speeds` field/`withSpeeds` became `Velocity`/`withVelocity(ChassisVelocities)`.
    citation: https://api.ctr-electronics.com/changelog

  - id: swerverequest-applyrobotspeeds-withspeeds
    kind: rename
    from:
      java: com.ctre.phoenix6.swerve.SwerveRequest.ApplyRobotSpeeds#withSpeeds
    to:
      java: com.ctre.phoenix6.swerve.SwerveRequest.ApplyRobotVelocity#withVelocity
    notes: 'The Speeds parameter was renamed Velocity. 2027 signature: `public final SwerveRequest.ApplyRobotVelocity withVelocity(org.wpilib.math.kinematics.ChassisVelocities newVelocity)`.'
    citation: https://api.ctr-electronics.com/changelog

  - id: swervedrivestate-speeds
    kind: rename
    from:
      java: com.ctre.phoenix6.swerve.SwerveDrivetrain.SwerveDriveState#Speeds
    to:
      java: com.ctre.phoenix6.swerve.SwerveDrivetrain.SwerveDriveState#Velocity
    notes: SwerveDriveState.Speeds was renamed to Velocity and is now an org.wpilib.math.kinematics.ChassisVelocities.
    citation: https://api.ctr-electronics.com/changelog

  - id: swervedrivestate-modulestates
    kind: rename
    from:
      java: com.ctre.phoenix6.swerve.SwerveDrivetrain.SwerveDriveState#ModuleStates
    to:
      java: com.ctre.phoenix6.swerve.SwerveDrivetrain.SwerveDriveState#ModuleVelocities
    notes: ModuleStates was renamed to ModuleVelocities (SwerveModuleVelocity[]). ModuleTargets keeps its name but is now SwerveModuleVelocity[].
    citation: https://api.ctr-electronics.com/changelog

  - id: swervemodule-getcurrentstate
    kind: rename
