    notes: Renamed in 26.50.0-alpha-1; returns org.wpilib.math.kinematics.SwerveModuleVelocity.
    citation: https://api.ctr-electronics.com/changelog

  - id: swervedrivetrainconstants-canbusname
    kind: rename
    from:
