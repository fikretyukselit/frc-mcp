    to:
      java: com.ctre.phoenix6.hardware.CANcoder#CANcoder
      python: phoenix6.hardware.CANcoder#CANcoder
    notes: 'String-bus and ID-only constructors were removed. 2027 signature: `public CANcoder(int deviceId, CANBus canbus)`.'
    citation: https://api.ctr-electronics.com/changelog

