    language: java
    license: BSD-3-Clause
    trust: official
    shard: wpilib-java-2027
    verified: true

  # ---- WPILib C++ API (M3): Doxygen HTML zips from WPILib Maven ----
  # No Doxygen XML or tag file is published; the adapter parses class pages.
  # include lists WPILib's own namespaces: the bundle also documents vendored
  # third-party code (fmt, Eigen, LLVM, Sleipnir, nlohmann).
