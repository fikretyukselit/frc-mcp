  # ---- Release notes (M3, frc_whats_new): GitHub releases of each project ----
  # One REST listing per repository (ETag, GITHUB_TOKEN when set). Seasons
  # come from each release's own version (facts.SeasonFor), so one shard holds
  # every season. Release notes are often generated from pull-request titles:
  # they are sanitized and flagged like any other text. Repositories without
  # a license for their notes are LicenseRef-* (kept local by publish).
  - id: wpilib-releases
    adapter: github-releases
    url: https://api.github.com/repos/wpilibsuite/allwpilib/releases?per_page=100
    base_url: https://github.com/wpilibsuite/allwpilib/releases/
    library: wpilib
    season: "all"
