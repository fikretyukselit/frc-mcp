# goreleaser v2: release binaries for the three OSes with checksums, a Syft
# SBOM per archive and a cosign keyless signature on the checksums (identity:
# this repository's release workflow). SLSA provenance and the container image
# are produced by .github/workflows/release.yml. Homebrew and Scoop packages
# are written by their own repositories (see the note at the end).
version: 2
project_name: frc-mcp
before:
  hooks:
    - go mod tidy
builds:
  - id: frc-mcp
    main: ./cmd/frc-mcp
    binary: frc-mcp
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE*]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
signs:
  # cosign v3 writes one Sigstore bundle (signature + certificate + Rekor entry).
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
release:
  prerelease: auto
  footer: |
    Verify: `cosign verify-blob --bundle checksums.txt.sigstore.json --certificate-identity-regexp '^https://github.com/fikretyukselit/frc-mcp/.github/workflows/release.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt`, then `sha256sum --check --ignore-missing checksums.txt`.
# Homebrew and Scoop: fikretyukselit/homebrew-tap and fikretyukselit/scoop-bucket
# update themselves from each release (hourly), after verifying checksums.txt
# against this workflow's signature; no cross-repository token is needed.
